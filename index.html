const MONTH_NAMES = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];

/* ------------------------------------------------------------------ */
/* 2. Gemini 프롬프트 빌더 + API 호출                                    */
/* ------------------------------------------------------------------ */
const SYSTEM_PROMPT = "너는 친절하고 전문적인 동물병원 마케터야.\n" +
"선택된 월과 수의학적 시즌 이슈를 바탕으로 마케팅 콘텐츠 2종을 JSON 형식으로 작성해.\n\n" +
"[규칙]\n" +
"- 수의사법 제32조를 준수해 100% 완치, 지역 1위 등의 과대 표현은 절대 금지할 것.\n" +
"- 블로그 제목: 클릭을 유발하면서도 보호자에게 안심을 주는 롱테일 키워드 중심 5개.\n" +
"- 카드뉴스: (슬라이드 1~4장 개요 및 후킹 문구) 형태의 실무용 구상안 3개.\n\n" +
"[JSON 출력 구조]\n" +
"{\n" +
'  "blogTitles": ["제목1", "제목2", "제목3", "제목4", "제목5"],\n' +
'  "cardNews": ["카드뉴스1 요약", "카드뉴스2 요약", "카드뉴스3 요약"]\n' +
"}";

function buildUserPrompt(monthNum) {
  const info = MONTH_DB[monthNum];
  const seasonLabel = SEASONS[info.season].label;
  const m = MONTH_NAMES[monthNum - 1];
  return "[선택된 월] " + m + " (" + seasonLabel + ")\n" +
    "[주요 시즌 이슈] " + info.issues.join(", ") + "\n" +
    "[주의 질환] " + info.diseases.join(", ") + "\n" +
    "[참고 메모] " + info.note + "\n\n" +
    "위 정보를 바탕으로 지시된 JSON 구조로만 응답해줘. 다른 설명 문구는 붙이지 마.";
}

function callGeminiAPI(monthNum, apiKey) {
  const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=" + apiKey;
  const fullPrompt = SYSTEM_PROMPT + "\n\n" + buildUserPrompt(monthNum);

  const body = {
    contents: [
      { parts: [{ text: fullPrompt }] }
    ]
  };

  return fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .catch(function (networkError) {
      console.error(networkError);
      throw new Error("네트워크 요청에 실패했어요. 인터넷 연결 또는 API 키를 확인해주세요.");
    })
    .then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (errJson) {
          const errDetail = (errJson && errJson.error && errJson.error.message) || "";
          const error = new Error(("Gemini API 오류 (" + res.status + ") " + errDetail).trim());
          console.error(error);
          throw error;
        });
      }
      return res.json();
    })
    .then(function (data) {
      const candidates = data && data.candidates;
      const rawText = candidates && candidates[0] && candidates[0].content &&
        candidates[0].content.parts && candidates[0].content.parts[0] &&
        candidates[0].content.parts[0].text;

      if (!rawText) {
        const error = new Error("응답에서 콘텐츠를 찾을 수 없어요.");
        console.error(error, data);
        throw error;
      }

      const cleaned = rawText.replace(/```json|```/g, "").trim();
      let parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (parseError) {
        console.error(parseError, rawText);
        throw new Error("응답 JSON을 해석하지 못했어요.");
      }

      if (!Array.isArray(parsed.blogTitles) || !Array.isArray(parsed.cardNews)) {
        const error = new Error("JSON 구조가 예상과 달라요.");
        console.error(error, parsed);
        throw error;
      }
      return { blogTitles: parsed.blogTitles, cardNews: parsed.cardNews };
    });
}

/* 폴백용 더미 콘텐츠 (API 키가 없거나 호출 실패 시 사용) */

  const blogTitles = [

    "우리 아이 '" + disease1 + "', 지금이 골든타임인 이유",
    seasonLabel + "철 필수 체크리스트 – '" + issue2 + "' 예방하는 법",
    "보호자님만 몰랐던 " + m + " 반려동물 건강 이슈 TOP 3",
    "원장님이 직접 알려주는 '" + disease2 + "' 대처법"
  ];

  const cardNews = [
    "[카드뉴스] " + m + " 보호자가 꼭 알아야 할 " + issue1 + " — 1p 표지: \"" + m + ", 우리 아이 괜찮을까요?\" · 2p 문제 제기: " + issue1 + " 발생 원인 · 3p 증상 체크리스트 · 4p 병원 내원 타이밍 안내",
    "[카드뉴스] " + disease1 + " 예방 3단계 — 1p 표지: 숫자로 보는 " + disease1 + " · 2p 원인/위험 요인 · 3p 가정에서 할 수 있는 예방 3단계 · 4p 병원 검진 항목 소개",
    "[카드뉴스] " + seasonLabel + "철 산책·나들이 안전수칙 — 1p 표지: " + seasonLabel + "철 나들이 전 체크! · 2p 이동 중 주의사항 · 3p " + issue2 + " 대응법 · 4p 응급 상황 대처 순서"
  ];

  return { blogTitles: blogTitles, cardNews: cardNews };
}

/* ------------------------------------------------------------------ */
/* 3. 복사 버튼 컴포넌트                                                */
/* ------------------------------------------------------------------ */
function CopyButton(props) {
  const text = props.text;
  const id = props.id;
  const copiedId = props.copiedId;
  const setCopiedId = props.setCopiedId;
  const copied = copiedId === id;

  const handleCopy = function () {
    navigator.clipboard.writeText(text).then(function () {
      setCopiedId(id);
      setTimeout(function () {
        setCopiedId(function (cur) { return cur === id ? null : cur; });
      }, 1500);
    }).catch(function (e) {
      console.error(e);
    });
  };

  return (
    <button
      onClick={handleCopy}
      className="shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 text-slate-400 hover:text-[#2F8577] hover:border-[#2F8577] hover:bg-[#EAF4F2] transition-colors text-sm"
      aria-label="복사"
      title="복사"
    >
      {copied ? "✅" : "📋"}
    </button>
  );
}

/* 4. 메인 앱                                                          */
/* ------------------------------------------------------------------ */
function App() {
  const currentMonth = new Date().getMonth() + 1;
  const [selectedMonth, setSelectedMonth] = React.useState(currentMonth);
  const [apiKey, setApiKey] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [copiedId, setCopiedId] = React.useState(null);
  const [error, setError] = React.useState(null);

  React.useEffect(function () {
    setResult(null);
  }, [selectedMonth]);

  const info = MONTH_DB[selectedMonth];
  const season = SEASONS[info.season];

  const handleGenerate = function () {
    setLoading(true);
    setResult(null);
    setError(null);

    const key = apiKey.trim();

    if (!key) {
      setTimeout(function () {
        setResult(buildDummyContent(selectedMonth));
        setError("Gemini API 키가 입력되지 않아 예시 콘텐츠를 보여드리고 있어요.");

      })

              📅
            </div>
            <div>
              <h1 className="text-2xl sm:text-[26px] font-bold tracking-tight font-display" style={{ color: "#1B2A38" }}>
                동물병원 시즌별 콘텐츠 달력 빌더
              </h1>
              <p className="text-sm text-slate-500 mt-1 leading-relaxed">
                월별 시즌 이슈에 맞춰 네이버 블로그 제목과 인스타그램 카드뉴스 기획을 자동으로 추천받으세요.
              </p>
            </div>
          </div>

          <div className="w-full lg:w-72 shrink-0">
            <label className="flex items-center gap-1.5 text-xs font-medium text-slate-500 mb-1.5">
              <span>🔑</span> Gemini API Key

            <input

            <p className="text-[11px] text-slate-400 mt-1.5">이 화면 세션 동안만 사용되며 외부로 전송되지 않아요.</p>
          </div>
        </header>

        <nav aria-label="월 선택" className="mb-6">
          <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 sm:gap-2.5">
            {MONTH_NAMES.map(function (label, idx) {

            </div>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <p className="text-xs font-semibold text-slate-500 mb-2">▸ 주요 시즌 이슈</p>
              <div className="flex flex-wrap gap-1.5">
                {info.issues.map(function (it) {
                  return (
                    <span key={it} className="text-xs px-2.5 py-1 rounded-full bg-white border" style={{ borderColor: season.color + "44", color: "#1B2A38" }}>
                      {it}
                    </span>
                  );
                })}
              </div>
            </div>
            <div>
              <p className="text-xs font-semibold text-slate-500 mb-2">🩺 주의 질환</p>
              <div className="flex flex-wrap gap-1.5">
                {info.diseases.map(function (d) {
                  return (
                    <span key={d} className="text-xs px-2.5 py-1 rounded-full text-white" style={{ background: "#1B2A38" }}>
                      {d}
                    </span>
                  );
                })}
              </div>
            </div>
          </div>
        </div>

        <div className="flex justify-center mb-4">
          <button
            onClick={handleGenerate}
            disabled={loading}
            className="inline-flex items-center gap-2 px-6 py-3.5 rounded-2xl text-white font-semibold text-sm text-center shadow-sm hover:shadow-md active:scale-[0.98] transition-all disabled:opacity-80 max-w-full"
            style={{ background: "#E8632C" }}
          >
            <span>{loading ? "⏳" : "✨"}</span>
            <span className="truncate">
              {loading ? "해당 월의 수의학 이슈를 분석하여 콘텐츠를 기획 중입니다..." : (MONTH_NAMES[selectedMonth - 1] + " 맞춤 콘텐츠 추천받기")}
            </span>
          </button>
        </div>

        {error && (
          <div className="flex items-start gap-2 text-[12.5px] text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-3.5 py-2.5 mb-6 max-w-2xl mx-auto">
            <span>⚠️</span>
            <span>{error}</span>
          </div>
        )}

        {result && (
          <div className="grid lg:grid-cols-2 gap-5 pb-10">
            <div className="bg-white rounded-2xl border border-slate-200 p-5">
              <div className="flex items-center gap-2 mb-4">
                <span>📝</span>
                <h2 className="text-sm font-bold text-[#1B2A38]">네이버 블로그 제목 추천 5개</h2>
              </div>
              <ul className="flex flex-col gap-2.5">
                {result.blogTitles.map(function (title, i) {
                  return (
                    <li key={i} className="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-slate-50/60 px-3.5 py-2.5">
                      <span className="text-[13px] leading-snug text-slate-700">{title}</span>
                      <CopyButton text={title} id={"blog-" + i} copiedId={copiedId} setCopiedId={setCopiedId} />
                    </li>
                  );
                })}
              </ul>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-5">
              <div className="flex items-center gap-2 mb-4">
                <span>📸</span>
                <h2 className="text-sm font-bold text-[#1B2A38]">인스타그램 카드뉴스 기획 3개</h2>
              </div>
              <ul className="flex flex-col gap-2.5">
                {result.cardNews.map(function (card, i) {
                  return (
                    <li key={i} className="rounded-xl border border-slate-100 bg-slate-50/60 px-3.5 py-3">
                      <div className="flex items-start justify-between gap-3">
                        <p className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#E8632C" }}>기획안 {i + 1}</p>
                        <CopyButton text={card} id={"ig-" + i} copiedId={copiedId} setCopiedId={setCopiedId} />
                      </div>
                      <p className="text-[12.5px] text-slate-600 mt-1.5 leading-relaxed whitespace-pre-line">{card}</p>
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>
        )}

        {!result && !loading && (
          <div className="flex flex-col items-center text-center text-slate-400 py-10">
            <div className="text-3xl mb-2 opacity-70">🐾</div>
            <p className="text-sm">버튼을 누르면 이 달의 콘텐츠 기획이 여기에 표시돼요.</p>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
