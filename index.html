<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동물병원 무한 콘텐츠 달력 빌더</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-subtle {
      animation: bounce-subtle 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MONTH_DATA = {
      1: { season: "겨울", title: "새해 건강검진 & 한파 질환", issues: ["노령견 관절/심장 질환", "저체온증 및 동상", "동계 신년 건강검진"] },
      2: { season: "겨울", title: "설 연휴 식이 중독 & 건조증", issues: ["명절 음식(전, 뼈) 섭취", "실내 건조 피부병", "자두/초콜릿 중독"] },
      3: { season: "봄", title: "심장사상충 예방 & 봄 산책", issues: ["심장사상충 예방 시작", "봄철 외부기생충/진드기", "야외 활동 증가 후 외상"] },
      4: { season: "봄", title: "꽃가루 알레르기 & 미세먼지", issues: ["봄철 안구/피부 알레르기", "미세먼지 호흡기 질환", "환절기 면역력 저하"] },
      5: { season: "봄", title: "가정의 달 피크 산책 & 외상", issues: ["야외활동 증가 슬개골/관절", "풀밭 진드기 감염", "체중 관리 및 비만"] },
      6: { season: "여름", title: "초여름 피부병 & 치과 케어", issues: ["습한 날씨 곰팡이성 피부염", "장마철 산책 후 습진", "스케일링 및 구강 관리"] },
      7: { season: "여름", title: "폭염 열사병 & 물놀이 질환", issues: ["여름철 열사병 응급 대처", "물놀이 후 급성 외이도염", "여름 과일(자두씨/포도) 중독"] },
      8: { season: "여름", title: "말복/막바지 무더위 & 식중독", issues: ["여름철 식중독/장염", "잔디밭 모기 매개 질환", "에어컨 냉방병/호흡기"] },
      9: { season: "가을", title: "추석 식이 사고 & 환절기", issues: ["추석 명절 음식 음복 예방", "가을철 털갈이 및 알레르기", "환절기 감기/기침"] },
      10: { season: "가을", title: "가을 산책 단풍철 & 가을진드기", issues: ["가을철 야생 진드기", "산책 시 밤/도토리 섭취", "노령견 음수량 관리"] },
      11: { season: "가을", title: "초겨울 관절 통증 & 건조증", issues: ["기온 저하 노령견 관절 통증", "실내 난방 피부 건조", "예방접종 재접종 시즌"] },
      12: { season: "겨울", title: "연말 주의사항 & 한파 대비", issues: ["연말 파티 음식 음복", "산책 로드쇼 염화칼슘 발바닥 상처", "겨울철 유선종양/검진"] }
    };

    const ANGLES = [
      "보호자가 흔히 하는 응급 착각/오해 바로잡기",
      "실제 병원 내원 사례 기반의 경각심 심어주기",
      "집에서 1분 만에 끝내는 홈케어/체크리스트",
      "초보 보호자를 위한 상황별 행동 요령 및 가이드라인",
      "비용과 고통을 90% 줄여주는 사전 예방 꿀팁",
      "특정 품종이나 세부 수의학 질환 깊이 파헤치기"
    ];

    const TARGETS = [
      "7세 이상 노령견/노령묘 보호자",
      "초보 댕냥이 집사 (1년 차 미만)",
      "야외 산책 및 활동성이 높은 활발한 아이의 보호자",
      "피부나 장이 민감해 병원을 자주 찾는 보호자",
      "다견/다묘가정 및 자율배식 보호자"
    ];

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_key") || "");
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth() + 1);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      const handleSaveKey = (e) => {
        const val = e.target.value;
        setApiKey(val);
        localStorage.setItem("gemini_key", val);
      };

      const generateContent = async () => {
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          alert("우측 상단에 Gemini API Key를 입력해주세요!");
          return;
        }

        setLoading(true);
        setErrorMsg("");
        const monthInfo = MONTH_DATA[selectedMonth];

        const randomAngle = ANGLES[Math.floor(Math.random() * ANGLES.length)];
        const randomTarget = TARGETS[Math.floor(Math.random() * TARGETS.length)];
        const randomSeed = Date.now();

        const promptText = `
너는 대한민국 최신 트렌드를 잘 아는 동물병원 전문 SNS 마케터야.

[기본 참고 정보]
- 해당 월: ${selectedMonth}월 (${monthInfo.season})
- 대표 키워드 예시: ${monthInfo.issues.join(", ")}

[핵심 요구사항]
위 대표 키워드는 기초 참고용일 뿐이야. 네가 알고 있는 전체 수의학 지식, 최신 반려인 트렌드, 대한민국 ${selectedMonth}월의 절기/날씨 특성을 총동원해서 **위 대표 키워드 목록에 적히지 않은 완전히 새로운 최신 수의학 이슈나 세부 질환**을 발굴해서 추천해줘.

[이번 생성 무작위 조건]
- 타깃층: ${randomTarget}
- 접근 앵글: ${randomAngle}
- 생성 씨드: ${randomSeed} (매번 기존과 완전히 차별화된 아이디어 제공)

[작성 요구사항]
1. 콘텐츠 주제: 보호자의 눈길을 끌 수 있는 독창적이고 획기적인 주제 3가지.
2. 카드뉴스 제작 가이드: 인스타그램 슬라이드별 핵심 구성안(표지-본문-결론/CTA).
3. AI 작성용 프롬프트: ChatGPT나 AI 툴에 붙여넣어 완벽한 인스타 원고를 써내려갈 실행용 프롬프트.
- 수의사법 제32조 준수 (과대/과장 표현 엄격 금지).

[반드시 순수 JSON 형식으로만 응답할 것]
{
  "items": [
    {
      "topic": "콘텐츠 주제 1",
      "guide": "인스타 카드뉴스 슬라이드별 구성 가이드",
      "aiPrompt": "ChatGPT나 AI 툴에 붙여넣어 카드뉴스 상세 원고를 작성하게 할 실행용 프롬프트"
    },
    {
      "topic": "콘텐츠 주제 2",
      "guide": "인스타 카드뉴스 슬라이드별 구성 가이드",
      "aiPrompt": "ChatGPT나 AI 툴에 붙여넣어 카드뉴스 상세 원고를 작성하게 할 실행용 프롬프트"
    },
    {
      "topic": "콘텐츠 주제 3",
      "guide": "인스타 카드뉴스 슬라이드별 구성 가이드",
      "aiPrompt": "ChatGPT나 AI 툴에 붙여넣어 카드뉴스 상세 원고를 작성하게 할 실행용 프롬프트"
    }
  ]
}
        `;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${cleanKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: {
                temperature: 0.98
              }
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(`API Error: ${res.status} (${errData.error?.message || "요청 실패"})`);
          }

          const data = await res.json();
          const rawText = data.candidates[0].content.parts[0].text;
          const cleanedJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
          const parsed = JSON.parse(cleanedJson);

          setResult(parsed);
        } catch (err) {
          console.error(err);
          setErrorMsg(err.message || "API 호출 실패! Key 입력 및 설정을 확인해 주세요.");
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        alert("프롬프트가 복사되었습니다! ChatGPT나 AI 툴에 붙여넣어 원고를 생성하세요.");
      };

      const monthInfo = MONTH_DATA[selectedMonth];

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                🎲 동물병원 무한 AI 콘텐츠 빌더
              </h1>
              <p className="text-slate-500 text-sm mt-1">지정된 키워드에 갇히지 않고, AI 수의학 데이터베이스에서 매번 새로운 주제를 발굴합니다.</p>
            </div>
            <div className="w-full md:w-72">
              <label className="block text-xs font-semibold text-slate-500 mb-1">🔑 Gemini API Key</label>
              <input
                type="password"
                placeholder="AIzaSy..."
                value={apiKey}
                onChange={handleSaveKey}
                className="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
          </div>

          {/* Month Selector */}
          <div className="grid grid-cols-4 md:grid-cols-6 gap-2 mb-6">
            {Object.keys(MONTH_DATA).map((m) => {
              const num = Number(m);
              const isSelected = num === selectedMonth;
              return (
                <button
                  key={num}
                  onClick={() => { setSelectedMonth(num); setResult(null); }}
                  className={`p-3 rounded-xl border text-center transition-all ${
                    isSelected
                      ? "bg-orange-500 text-white border-orange-500 font-bold shadow-md scale-105"
                      : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"
                  }`}
                >
                  <div className="text-lg">{num}월</div>
                  <div className={`text-xs ${isSelected ? "text-orange-100" : "text-slate-400"}`}>
                    {MONTH_DATA[num].season}
                  </div>
                </button>
              );
            })}
          </div>

          {/* Month Info Card */}
          <div className="bg-orange-50 border border-orange-200 rounded-2xl p-6 mb-8">
            <h2 className="text-lg font-bold text-orange-900 mb-2 flex items-center gap-2">
              ☀️ {selectedMonth}월 기본 테마: {monthInfo.title}
            </h2>
            <p className="text-xs text-orange-700 mb-3">기본 키워드 외에도 AI가 다양한 수의학 지식을 결합하여 매번 새로운 주제를 생성합니다.</p>
            <div className="flex flex-wrap gap-2">
              {monthInfo.issues.map((issue, idx) => (
                <span key={idx} className="bg-white text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 shadow-sm">
                  #{issue}
                </span>
              ))}
            </div>
          </div>

          {/* Submit Button with Dynamic Motion */}
          <button
            onClick={generateContent}
            disabled={loading}
            className={`w-full py-4 font-bold rounded-2xl shadow-lg transition-all text-lg flex items-center justify-center gap-3 mb-8 ${
              loading
                ? "bg-slate-700 text-white cursor-not-allowed animate-pulse"
                : "bg-gradient-to-r from-orange-500 to-amber-500 text-white hover:opacity-95 active:scale-[0.99]"
            }`}
          >
            {loading ? (
              <>
                <svg className="animate-spin h-6 w-6 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>AI가 새로운 수의학 앵글을 구성하는 중...</span>
              </>
            ) : (
              <span>🎲 {selectedMonth}월 새로운 무작위 주제 발굴하기</span>
            )}
          </button>

          {/* Loading Visual Indicator Card */}
          {loading && (
            <div className="bg-white p-8 rounded-2xl border border-orange-200 shadow-md text-center mb-8 animate-bounce-subtle">
              <div className="inline-block p-4 bg-orange-100 rounded-full text-2xl mb-3">
                🧠
              </div>
              <h3 className="text-lg font-bold text-slate-800 mb-1">수의학 전문 데이터 검색 및 앵글 조합 중...</h3>
              <p className="text-xs text-slate-500">잠시만 기다려주시면 참신한 주제와 인스타 카드뉴스 프롬프트가 도출됩니다.</p>
            </div>
          )}

          {errorMsg && (
            <div className="p-4 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl mb-6">
              ⚠️ {errorMsg}
            </div>
          )}

          {/* Results */}
          {!loading && result && result.items && (
            <div className="space-y-6">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                💡 {selectedMonth}월 추천 콘텐츠 주제 & 인스타 가이드
              </h2>

              {result.items.map((item, idx) => (
                <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 hover:border-orange-200 transition-colors">
                  {/* 1. 콘텐츠 주제 (최상단) */}
                  <div className="border-b border-slate-100 pb-3">
                    <span className="text-xs font-bold text-orange-500 uppercase tracking-wider">Topic 0{idx + 1}</span>
                    <h3 className="text-xl font-bold text-slate-900 mt-1">
                      📌 {item.topic}
                    </h3>
                  </div>

                  {/* 2. 인스타 카드뉴스 구성 가이드 */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h4 className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-1">
                      📸 인스타그램 카드뉴스 구성 가이드
                    </h4>
                    <p className="text-sm text-slate-600 whitespace-pre-line leading-relaxed">
                      {item.guide}
                    </p>
                  </div>

                  {/* 3. AI 작성용 프롬프트 */}
                  <div className="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                    <div className="flex items-center justify-between mb-2">
                      <h4 className="text-sm font-bold text-orange-900 flex items-center gap-1">
                        🤖 원고 작성용 AI 프롬프트
                      </h4>
                      <button
                        onClick={() => copyToClipboard(item.aiPrompt)}
                        className="px-3 py-1 text-xs bg-orange-500 text-white rounded-lg hover:bg-orange-600 font-semibold transition-colors shadow-sm"
                      >
                        📋 프롬프트 복사
                      </button>
                    </div>
                    <p className="text-xs text-slate-700 bg-white p-3 rounded-lg border border-orange-200/60 font-mono leading-relaxed">
                      {item.aiPrompt}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
