<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동물병원 시즌별 콘텐츠 달력 빌더</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MONTH_DATA = {
      1: { season: "겨울", title: "새해 건강검진 & 한파 질환", issues: ["노령견 관절/심장 질환", "저체온증 및 동상", "동계 신년 건강검진"] },
      2: { season: "겨울", title: "설 연휴 식이 중독 & 건조증", issues: ["명절 음식(전, 뼈) 섭취", "실내 건조 피부병", "자두/초콜릿 중독"] },
      3: { season: "봄", title: "심장사상충 예방 & 봄 산책", issues: ["심장사상충 예방 시작", "봄철 외부기생충/진드기", "야외 활동 증가 후 외상"] },
      4: { season: "봄", title: "꽃가루 알레르기 & 미세먼지", issues: ["봄철 안구/피부 알레르기", "미세먼지 호흡기 질환", "환절기 면역력 저하"] },
      5: { season: "봄", title: "가정의 달 피크 산책 & 외상", issues: ["야외활동 증가 슬개골/관절", "풀밭 진드기 감염", "체중 관리 및 비만"] },
      6: { season: "여름", title: "초여름 피부병 & 치과 케어", issues: ["습한 날씨 곰팡이성 피부염", "장마철 산책 후 습진", "스케일링 및 구강 관리"] },
      7: { season: "여름", title: "폭염 열사병 & 물놀이 질환", issues: ["여름철 열사병 응급 대처", "물놀이 후 급성 외이도염", "여름 과일(자두씨/포도) 중독"] },
      8: { season: "여름", title: "말복/막바지 무더위 & 식중독", issues: ["여름철 식중독/장염", "잔디밭 모기 매개 질환", "에어컨 냉방병/호흡기"] },
      9: { season: "가을", title: "추석 식이 사고 & 환절기", issues: ["추석 명절 음식 음복 예방", "가을철 털갈이 및 알레르기", "환절기 감기/기침"] },
      10: { season: "가을", title: "가을 산책 단풍철 & 가을진드기", issues: ["가을철 야생 진드기", "산책 시 밤/도토리 섭취", "노령견 음수량 관리"] },
      11: { season: "가을", title: "초겨울 관절 통증 & 건조증", issues: ["기온 저하 노령견 관절 통증", "실내 난방 피부 건조", "예방접종 재접종 시즌"] },
      12: { season: "겨울", title: "연말 주의사항 & 한파 대비", issues: ["연말 파티 음식 음복", "산책 로드쇼 염화칼슘 발바닥 상처", "겨울철 유선종양/검진"] }
    };

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_key") || "");
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth() + 1);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      const handleSaveKey = (e) => {
        const val = e.target.value;
        setApiKey(val);
        localStorage.setItem("gemini_key", val);
      };

      const generateContent = async () => {
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          alert("우측 상단에 Gemini API Key를 입력해주세요!");
          return;
        }

        setLoading(true);
        setErrorMsg("");
        const monthInfo = MONTH_DATA[selectedMonth];

        const promptText = `
너는 동물병원 마케팅 전문가야. 
${selectedMonth}월(${monthInfo.title})의 주요 이슈 [${monthInfo.issues.join(", ")}]를 바탕으로 마케팅 콘텐츠를 추천해줘.

[작성 규칙]
- 수의사법 제32조를 준수해 100% 완치, 지역 1위 등의 과대 표현 금지.
- 블로그 제목: 보호자 안심 및 검색 유입용 롱테일 키워드 5개.
- 카드뉴스: 인스타그램 4장 분량 핵심 구상안 3개.
- 진부하거나 똑같은 문구를 반복하지 말고, 보호자의 공감을 이끌어낼 수 있는 다양하고 참신한 앵글로 작성할 것.

[반드시 순수 JSON 형식으로만 응답할 것]
{
  "blogTitles": ["제목1", "제목2", "제목3", "제목4", "제목5"],
  "cardNews": ["카드뉴스1 요약", "카드뉴스2 요약", "카드뉴스3 요약"]
}
        `;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${cleanKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                {
                  parts: [{ text: promptText }]
                }
              ],
              generationConfig: {
                temperature: 0.95 // 다채롭고 새로운 결과를 나오게 하는 다양성 옵션
              }
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(`API Error: ${res.status} (${errData.error?.message || "요청 실패"})`);
          }

          const data = await res.json();
          const rawText = data.candidates[0].content.parts[0].text;
          const cleanedJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
          const parsed = JSON.parse(cleanedJson);

          setResult(parsed);
        } catch (err) {
          console.error(err);
          setErrorMsg(err.message || "API 호출 실패! Key 입력 및 구글 AI 스튜디오 설정을 확인해 주세요.");
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        alert("복사되었습니다!");
      };

      const monthInfo = MONTH_DATA[selectedMonth];

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                📅 동물병원 시즌별 콘텐츠 달력 빌더
              </h1>
              <p className="text-slate-500 text-sm mt-1">월별 수의학 이슈에 맞는 블로그 및 인스타 기획안을 AI로 즉시 생성합니다.</p>
            </div>
            <div className="w-full md:w-72">
              <label className="block text-xs font-semibold text-slate-500 mb-1">🔑 Gemini API Key</label>
              <input
                type="password"
                placeholder="AIzaSy..."
                value={apiKey}
                onChange={handleSaveKey}
                className="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
          </div>

          {/* Month Selector */}
          <div className="grid grid-cols-4 md:grid-cols-6 gap-2 mb-6">
            {Object.keys(MONTH_DATA).map((m) => {
              const num = Number(m);
              const isSelected = num === selectedMonth;
              return (
                <button
                  key={num}
                  onClick={() => { setSelectedMonth(num); setResult(null); }}
                  className={`p-3 rounded-xl border text-center transition-all ${
                    isSelected
                      ? "bg-orange-500 text-white border-orange-500 font-bold shadow-md scale-105"
                      : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"
                  }`}
                >
                  <div className="text-lg">{num}월</div>
                  <div className={`text-xs ${isSelected ? "text-orange-100" : "text-slate-400"}`}>
                    {MONTH_DATA[num].season}
                  </div>
                </button>
              );
            })}
          </div>

          {/* Month Info Card */}
          <div className="bg-orange-50 border border-orange-200 rounded-2xl p-6 mb-8">
            <h2 className="text-lg font-bold text-orange-900 mb-2 flex items-center gap-2">
              ☀️ {selectedMonth}월 시즌 브리핑: {monthInfo.title}
            </h2>
            <div className="flex flex-wrap gap-2 mt-3">
              {monthInfo.issues.map((issue, idx) => (
                <span key={idx} className="bg-white text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 shadow-sm">
                  #{issue}
                </span>
              ))}
            </div>
          </div>

          {/* Submit Button */}
          <button
            onClick={generateContent}
            disabled={loading}
            className="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-2xl shadow-lg hover:opacity-95 transition-all disabled:opacity-50 text-lg flex items-center justify-center gap-2 mb-8"
          >
            {loading ? "🔄 새로운 각도로 콘텐츠 기획안을 생성 중..." : `✨ ${selectedMonth}월 맞춤 콘텐츠 추천받기`}
          </button>

          {errorMsg && (
            <div className="p-4 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl mb-6">
              ⚠️ {errorMsg}
            </div>
          )}

          {/* Results */}
          {result && (
            <div className="space-y-6">
              {/* Blog Titles */}
              <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                  📝 네이버 블로그 추천 제목 (5개)
                </h3>
                <div className="space-y-2">
                  {result.blogTitles?.map((title, i) => (
                    <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors">
                      <span className="text-sm text-slate-700 font-medium">{i + 1}. {title}</span>
                      <button
                        onClick={() => copyToClipboard(title)}
                        className="px-3 py-1 text-xs bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 font-semibold"
                      >
                        📋 복사
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Instagram Card News */}
              <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                  📸 인스타그램 카드뉴스 기획 (3개)
                </h3>
                <div className="space-y-3">
                  {result.cardNews?.map((card, i) => (
                    <div key={i} className="flex items-start justify-between p-4 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors gap-4">
                      <p className="text-sm text-slate-700 leading-relaxed font-medium">{i + 1}. {card}</p>
                      <button
                        onClick={() => copyToClipboard(card)}
                        className="shrink-0 px-3 py-1 text-xs bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 font-semibold"
                      >
                        📋 복사
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
